name: APK Escritório
on:
  push:
    paths: ["apps/escritorio-android/**", ".github/workflows/escritorio-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Montar APK
        working-directory: apps/escritorio-android
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          PLAT=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar
          echo "build-tools: $BT"; echo "platform: $PLAT"
          rm -rf build && mkdir -p build/gen build/obj build/dex
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/base.apk -I $PLAT --manifest AndroidManifest.xml -R build/res.zip --java build/gen \
            --min-sdk-version 24 --target-sdk-version 34 --version-code ${{ github.run_number }} --version-name 1.${{ github.run_number }}
          javac -nowarn -source 8 -target 8 -bootclasspath $PLAT -d build/obj $(find src build/gen -name '*.java')
          $BT/d8 --release --min-api 24 --lib $PLAT --output build/dex $(find build/obj -name '*.class')
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          $BT/zipalign -p -f 4 build/unsigned.apk build/aligned.apk
          $BT/apksigner sign --ks escritorio.jks --ks-pass pass:escritorio123 --key-pass pass:escritorio123 --ks-key-alias escritorio --out Escritorio.apk build/aligned.apk
          $BT/apksigner verify --verbose --print-certs Escritorio.apk | head -8
          $BT/aapt2 dump badging Escritorio.apk | head -6
          sha256sum Escritorio.apk
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete escritorio-apk -y --cleanup-tag || true
          gh release create escritorio-apk apps/escritorio-android/Escritorio.apk -t "Escritório (app Android)" -n "Abre o Escritório Stick To Sales no Chrome, com o seu login do Claude."
